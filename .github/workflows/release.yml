name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-latest
    env:
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version and tag
        id: version
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${build}" =~ ^[1-9][0-9]*$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            expected_ref="refs/tags/v${version}"
            if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${version}." >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      - name: Test Swift package
        run: swift test

      - name: Build unsigned universal dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./scripts/build.sh release --universal
          archive="dist/Codex-Awake-${{ steps.version.outputs.version }}-unnotarized-ci.zip"
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc "build/Codex Awake.app" "${archive}"

      - name: Upload unsigned dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Awake-${{ steps.version.outputs.version }}-unnotarized-ci
          path: dist/Codex-Awake-${{ steps.version.outputs.version }}-unnotarized-ci.zip
          if-no-files-found: error

      - name: Require release credentials
        if: github.event_name == 'push'
        shell: bash
        run: |
          required_values=(
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_DEVELOPER_ID_APPLICATION
            APPLE_NOTARY_KEY_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
          )
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              echo "Required release setting is missing: ${value_name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        if: github.event_name == 'push'
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/codex-awake.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}" | /usr/bin/base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | /usr/bin/base64 -D > "${RUNNER_TEMP}/AuthKey.p8"

      - name: Build, sign, notarize, and package release
        if: github.event_name == 'push'
        env:
          CODEX_AWAKE_SIGN_IDENTITY: ${{ env.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: ./scripts/package-release.sh

      - name: Attest release archive
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/Codex-Awake-${{ steps.version.outputs.version }}-universal.zip

      - name: Upload release workflow artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Awake-${{ steps.version.outputs.version }}-release
          path: |
            dist/Codex-Awake-${{ steps.version.outputs.version }}-universal.zip
            dist/Codex-Awake-${{ steps.version.outputs.version }}-universal.zip.sha256
            dist/codex-cli-awake.rb
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v${version}" \
            "dist/Codex-Awake-${version}-universal.zip" \
            "dist/Codex-Awake-${version}-universal.zip.sha256" \
            "dist/codex-cli-awake.rb" \
            --generate-notes \
            --title "Codex Awake ${version}" \
            --verify-tag

      - name: Remove temporary signing material
        if: always() && github.event_name == 'push'
        run: |
          security delete-keychain "${RUNNER_TEMP}/codex-awake.keychain-db" >/dev/null 2>&1 || true
          rm -f -- "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/AuthKey.p8"
