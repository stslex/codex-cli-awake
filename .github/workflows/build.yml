name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test Swift package
        run: swift test

      - name: Build Swift package
        run: swift build -c release

      - name: Build universal app bundle
        run: ./scripts/build.sh release --universal

      - name: Verify universal app bundle
        run: |
          binary="build/Codex Awake.app/Contents/MacOS/CodexAwake"
          architectures="$(lipo -archs "${binary}")"
          [[ " ${architectures} " == *" arm64 "* ]]
          [[ " ${architectures} " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "build/Codex Awake.app"
